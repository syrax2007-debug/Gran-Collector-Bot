<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waifu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

:root{
  --neon:#e0192e; --neon2:#ff5a52; --neon3:#7a0c18; --metal:linear-gradient(135deg,#ff6a5a,#d4152a 40%,#7a0c18 65%,#e0334a);
  --dark:#050d10; --glass:rgba(10,4,8,.42); --glass2:rgba(0,0,0,.4);
  --text:#fff; --muted:#c9a6a2; --gold:#ffd24a;
  --c1:#3ddc84; --c2:#3aa0ff; --c3:#c8102e; --c4:#ff9a1a; --c5:#22e6e0;
  --glow:0 0 5px #e0192e,0 0 14px rgba(224,25,46,.7);
  --head:"Orbitron","Segoe UI",Arial,sans-serif; --body:"Rajdhani","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--body);font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.08em;font-size:14px;
  background:#031013;height:100dvh;padding-top:12px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:520px;width:100%;height:100%;margin:0 auto;display:flex;flex-direction:column}

/* PLITA (kesilgan burchakli neon ramka) */
.bev{--c:10px;background:var(--metal);padding:1.5px;
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.bev>.in{background:linear-gradient(180deg,rgba(28,8,14,.62),rgba(4,10,12,.62));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);height:100%;
  clip-path:polygon(calc(var(--c) - .9px) 0,calc(100% - var(--c) + .9px) 0,100% calc(var(--c) - .9px),100% calc(100% - var(--c) + .9px),calc(100% - var(--c) + .9px) 100%,calc(var(--c) - .9px) 100%,0 calc(100% - var(--c) + .9px),0 calc(var(--c) - .9px))}

/* TEPA */
.header{flex:none;display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:6px;align-items:center;margin-bottom:14px}
.slot{height:36px;background:linear-gradient(180deg,rgba(28,8,14,.62),rgba(4,10,12,.62));border-top:2px solid var(--neon);border-bottom:1px solid var(--neon3);
  display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:9px;color:var(--muted);letter-spacing:.14em;
  box-shadow:0 0 10px rgba(255,31,61,.35)}
.slot b{font-family:var(--head);font-size:12px;color:var(--neon2);text-shadow:0 0 8px var(--neon)}
.slot.l{clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.slot.r{clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)}
.nameplate{--c:12px}
.nameplate .in{padding:9px 6px;text-align:center}
#uname{font-family:var(--head);font-weight:900;font-size:14px;letter-spacing:.14em;color:var(--neon2);text-shadow:var(--glow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ASOSIY PANEL */
.frame{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:0;background:var(--glass);border:1px solid rgba(224,25,46,.4);
  box-shadow:inset 0 0 50px rgba(0,0,0,.4),0 0 18px rgba(224,25,46,.1);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:hidden}
.sc{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 16px 24px;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.frame::before{content:"";position:absolute;inset:5px;pointer-events:none;
  --b:var(--neon);
  background:
   linear-gradient(var(--b),var(--b)) 0 0/20px 2px no-repeat,linear-gradient(var(--b),var(--b)) 0 0/2px 20px no-repeat,
   linear-gradient(var(--b),var(--b)) 100% 0/20px 2px no-repeat,linear-gradient(var(--b),var(--b)) 100% 0/2px 20px no-repeat,
   linear-gradient(var(--b),var(--b)) 0 100%/20px 2px no-repeat,linear-gradient(var(--b),var(--b)) 0 100%/2px 20px no-repeat,
   linear-gradient(var(--b),var(--b)) 100% 100%/20px 2px no-repeat,linear-gradient(var(--b),var(--b)) 100% 100%/2px 20px no-repeat;
  filter:drop-shadow(0 0 4px var(--neon))}
.flame{position:absolute;pointer-events:none;background:linear-gradient(120deg,var(--neon3),var(--neon),#ff5a4a);filter:drop-shadow(0 0 8px var(--neon))}
.flame.a{right:0;top:0;width:46%;height:26px;clip-path:polygon(0 0,100% 0,100% 100%,62% 40%,30% 18%)}
.flame.b{left:0;bottom:0;width:46%;height:26px;clip-path:polygon(0 0,38% 60%,70% 82%,100% 100%,0 100%)}
.tab{display:none;position:relative;z-index:2}.tab.on{display:block}

.title{position:relative;text-align:center;margin:4px 0 16px}
.title small{display:block;font-family:var(--head);font-size:8px;letter-spacing:.5em;color:var(--muted);margin-bottom:6px}
.title h1{font-family:var(--head);font-weight:900;font-size:24px;letter-spacing:.12em;color:var(--neon2);text-shadow:var(--glow)}

/* PROFIL */
.top{display:flex;align-items:center;justify-content:flex-start;gap:12px}
#avatar{width:50px;height:50px;flex:none;border-radius:50%;border:2px solid var(--neon);box-shadow:var(--glow);background:var(--glass2) center/cover no-repeat;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:20px;font-weight:900;color:var(--neon2)}
#avatar img{width:100%;height:100%;object-fit:cover}
#handle{color:#fff;font-size:14px;text-shadow:0 0 6px #000}
.pbox{--c:12px;margin-top:12px}
.pbox .in{padding:12px 10px 10px;background:linear-gradient(180deg,rgba(20,4,8,.38),rgba(3,10,12,.5))}
.mini{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;border-top:1px solid rgba(224,25,46,.45);padding-top:8px}
.mini .st{text-align:center;padding:0 2px}
.mini .st+.st{border-left:1px solid rgba(224,25,46,.4)}
.mini small{display:block;font-size:8px;letter-spacing:.1em;color:var(--muted)}
.mini b{font-family:var(--head);font-size:15px;color:var(--neon2);text-shadow:0 0 8px var(--neon)}

.pic{position:relative;overflow:hidden;width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:900;font-size:22px;
  border:2px solid var(--rc,#888);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 50%,#000),#0a0a0a);box-shadow:0 0 10px color-mix(in srgb,var(--rc) 55%,transparent)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cnt{position:absolute;right:0;top:0;background:var(--neon);font-family:var(--head);font-size:10px;padding:2px 6px;z-index:2}
#mcont .pic{font-size:56px}

/* KOLLEKSIYA */
.bar{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;min-width:0;padding:10px;background:var(--glass2);border:1px solid var(--neon);color:#fff;font:inherit;text-transform:uppercase;outline:none;box-shadow:0 0 8px rgba(255,31,61,.3)}
.btn{padding:10px 14px;background:linear-gradient(180deg,var(--neon),var(--neon3));color:#fff;border:0;font-family:var(--head);font-weight:700;font-size:10px;letter-spacing:.14em;cursor:pointer;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);text-shadow:0 0 6px rgba(0,0,0,.6)}
.btn.ghost{background:var(--dark);color:var(--neon2);box-shadow:inset 0 0 0 1px var(--neon)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 10px;border:1px solid var(--neon);background:var(--glass2);color:#fff;font:inherit;font-size:12px;cursor:pointer;letter-spacing:.12em}
.chip[data-k]:not([data-k="0"])::before{content:"";display:inline-block;width:7px;height:7px;background:var(--rc);margin-right:6px}
.chip.on{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.grid{display:grid;gap:8px}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.it{cursor:pointer;min-width:0}
.it .nm{display:block;margin-top:4px;font-size:11px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mn{display:block;font-size:9px;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4 .it .nm{font-size:10px}
.empty2{grid-column:1/-1;text-align:center;color:var(--muted);padding:24px 0}

/* DOKON */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sitem .in{padding:14px 8px;text-align:center}
.sitem .big{font-family:var(--head);font-size:18px;font-weight:900;color:var(--gold);text-shadow:0 0 10px rgba(255,210,74,.5)}
.sitem .rn{font-size:13px;margin:4px 0 10px}
.demo{text-align:center;font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}

/* REFERAL */
.refbox{display:flex;flex-direction:column;gap:9px}
.line{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--glass2);border-left:3px solid var(--neon);box-shadow:-4px 0 10px -4px var(--neon)}
.line b{font-family:var(--head);font-size:13px}
.link{padding:10px;background:var(--glass2);border:1px dashed var(--neon);font-size:11px;word-break:break-all;text-transform:none;letter-spacing:.02em}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}

/* OYIN */
#ginfo{text-align:center;color:var(--muted);margin-bottom:8px;font-size:13px;line-height:1.6}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:6px auto 12px}
.gc{--c:9px;aspect-ratio:1/1;cursor:pointer;border:0;font:inherit;color:inherit;display:block}
.gc .in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--head);font-weight:900;font-size:22px;color:var(--neon2);text-shadow:var(--glow)}
.gc .in small{font-size:10px;letter-spacing:.06em;text-shadow:none}
.gc.open .in{color:var(--gold);background:var(--glass2);text-shadow:none}
.gc.open{opacity:.55}
.gc.open.picked{opacity:1}
.gc.open.picked .in{box-shadow:inset 0 0 0 2px #fff}
.gc.prize{opacity:1}
.gc.prize .in{background:linear-gradient(180deg,var(--neon3),#3b0610);color:#fff}
#gmsg{text-align:center;min-height:38px;font-weight:700;font-size:15px;line-height:1.5}
#again{display:block;margin:10px auto 0}
.note{margin-top:12px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}

/* PASTKI PANEL */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 8px calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(8,4,8,.2),rgba(8,4,8,.94) 35%);border-top:2px solid var(--neon);box-shadow:0 -2px 18px rgba(255,31,61,.55)}
.row{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nb{--c:8px;border:0;cursor:pointer;font:inherit;color:inherit;display:block;min-width:0}
.nb .in{padding:5px 0 6px;text-align:center}
.nb small{display:block;font-size:7px;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid rgba(255,31,61,.35);margin:0 5px 4px;padding-bottom:2px;white-space:nowrap;overflow:hidden}
.nb span{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--neon2);text-shadow:0 0 6px var(--neon);white-space:nowrap}
.nb.on .in{background:linear-gradient(180deg,#4a0a14,#1a0408)}
.nb.on span{color:#fff;text-shadow:var(--glow)}

#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#modal.on{display:flex}
#mbox{width:100%;max-width:310px;margin:auto}
#mbox .in{padding:18px;display:flex;flex-direction:column;gap:10px}
#mbox h3{font-family:var(--head);text-align:center;color:var(--neon2);text-shadow:var(--glow);letter-spacing:.14em;font-size:14px}
.mname{text-align:center;font-size:16px}
.msub{text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:90;padding:8px 18px;background:var(--neon);font-family:var(--head);font-size:11px;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 0 14px var(--neon);max-width:92%;text-align:center}
#toast.on{opacity:1}

/* O'YIN TANLASH + SLOT */
.gsel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.gs{--c:10px;border:0;cursor:pointer;font:inherit;color:inherit;display:block}
.gs .in{padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.gs .ic{font-size:30px;line-height:1.1}
.gs b{font-family:var(--head);font-size:12px;letter-spacing:.14em;color:var(--neon2)}
.gs small{font-size:9px;color:var(--muted);letter-spacing:.1em}
.gs.on .in{background:linear-gradient(180deg,#5a0b18,#1a0408);box-shadow:inset 0 -2px 0 var(--neon)}
.gs.on b{color:#fff;text-shadow:var(--glow)}
#sinfo{text-align:center;color:var(--muted);margin-bottom:10px;font-size:13px;line-height:1.6}
.slotbox{--c:14px;margin:4px 0 12px}
.slotbox>.in{padding:14px 12px;height:auto}
.reels{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reel{height:87px;overflow:hidden;position:relative;background:rgba(0,0,0,.6);border:1.5px solid var(--neon);box-shadow:inset 0 0 18px #000,0 0 10px rgba(224,25,46,.4)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:24px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(rgba(0,0,0,.8),transparent)}
.reel::after{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.strip{will-change:transform}
.sy{height:84px;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1}
.reel.spin .strip{filter:blur(1.6px)}
.reel.stop{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.07)}}
.payline{position:absolute;left:-4px;right:-4px;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,var(--neon),transparent);box-shadow:0 0 8px var(--neon);pointer-events:none;z-index:3}
.reels.win{animation:wing .45s ease-in-out 5}
@keyframes wing{50%{filter:drop-shadow(0 0 16px #ffd24a) brightness(1.35)}}
.reels.lose{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#spin{display:block;margin:0 auto}
#spin:disabled{opacity:.45;filter:grayscale(.6)}
#smsg{text-align:center;min-height:38px;margin-top:8px;font-weight:700;font-size:15px;line-height:1.5}
.ptable{display:grid;gap:6px;margin:8px 0 12px}
.ptable .line{padding:7px 10px;font-size:12px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:85;pointer-events:none}
/* PROFIL FONI: sevimli waifu */
.favbg{position:absolute;inset:0;z-index:0;display:none;background:center/cover no-repeat;pointer-events:none}
.frame[data-tab="profil"] .favbg{display:block}
.favbg::before{content:attr(data-ini);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:900;font-size:150px;color:rgba(255,255,255,.12)}
.favbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,10,12,.62) 0%,rgba(3,10,12,.05) 36%,rgba(3,10,12,.15) 58%,rgba(3,10,12,.85) 100%)}
.frame.has-fav #tab-profil.on{display:flex;flex-direction:column;min-height:100%}
.favtag{margin-top:auto;padding:0 0 4px;text-align:center;font-size:14px;line-height:1.7;text-shadow:0 0 10px #000,0 0 4px #000}
.favtag b{display:block;font-family:var(--head);font-size:17px;color:#fff;letter-spacing:.14em}
.favtag small{font-size:12px;color:var(--neon2);letter-spacing:.14em}
.favtag.hint{margin-top:14px;color:var(--muted);font-size:12px;text-shadow:none}
.frame:not([data-tab="profil"]) .favtag{display:none}
/* YURAKCHA */
.it{position:relative}
.heart{position:absolute;left:5px;top:5px;z-index:3;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,90,82,.9);background:rgba(3,10,12,.6);color:var(--neon2);font:400 17px/1 Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.heart.on{background:var(--neon);border-color:#fff;color:#fff;box-shadow:0 0 12px var(--neon)}
.heart:active{transform:scale(.9)}
/* oy kechasi sahnasi */
.sky{position:fixed;inset:0;z-index:-5;background:radial-gradient(100% 60% at 20% 0%,#0b2a30 0%,transparent 65%),linear-gradient(180deg,#041a1e,#020a0c 60%,#14030a)}
.moon{position:fixed;left:-34px;top:64px;width:170px;height:170px;border-radius:50%;z-index:-4;opacity:.92;
  background:radial-gradient(circle at 34% 30%,rgba(110,116,128,.35) 0 9%,transparent 10%),radial-gradient(circle at 62% 58%,rgba(110,116,128,.3) 0 12%,transparent 13%),radial-gradient(circle at 48% 78%,rgba(110,116,128,.25) 0 7%,transparent 8%),radial-gradient(circle at 74% 26%,rgba(110,116,128,.25) 0 6%,transparent 7%),radial-gradient(circle at 38% 36%,#fff,#e9ecf2 55%,#aab0bd);
  box-shadow:0 0 60px 14px rgba(220,228,255,.22),0 0 160px 40px rgba(220,228,255,.1)}
.cloud{position:fixed;z-index:-3;border-radius:50%;filter:blur(26px);background:rgba(150,160,175,.16);animation:drift 60s linear infinite alternate}
.cloud.a{left:30%;top:90px;width:260px;height:56px}
.cloud.b{left:-10%;top:300px;width:300px;height:64px;animation-duration:80s;background:rgba(120,130,150,.12)}
@keyframes drift{to{transform:translateX(120px)}}
#ff{position:fixed;inset:0;z-index:-2;width:100%;height:100%;pointer-events:none}
.field{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:-1;pointer-events:none;opacity:.8;-webkit-mask:linear-gradient(0deg,#000 55%,transparent);mask:linear-gradient(0deg,#000 55%,transparent)}
.field svg{position:absolute;bottom:-14px;overflow:visible}
.orn{position:absolute;right:-8px;bottom:-10px;width:120px;height:120px;opacity:.85;pointer-events:none;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
